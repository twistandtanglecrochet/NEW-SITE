    <script>
      /* Speed switches (Admin → Speed) are read from the saved copy of the settings. On a first visit they come from /api/shop (below). */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("ttc_settings_v1") || "null"), sp = (s && s.speed) || {};
          // First visit (nothing saved in this browser yet): ask for the live settings at once, so the speed
          // switches (smaller photos, lighter motion, …) already apply to the very first screen.
          if (!s && window.fetch) {
            window.__ttcEarlyP = fetch("/api/shop").then(function (r) { return r.ok ? r.json() : null; })
              .then(function (d) { if (d && d.settings) window.__ttcEarlySettings = d.settings; return d; }).catch(function () { return null; });
            window.__ttcEarly = window.__ttcEarlyP;
          }
          if (sp.apiShop && window.fetch) {
            window.__ttcEarly = fetch("/api/shop").then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("api")); });
            window.__ttcEarly.catch(function () { window.__ttcEarly = null; });
          }
          if (sp.lcp) {
            var h = JSON.parse(localStorage.getItem("ttc_hero_v1") || "null");
            if (h && h.src) {
              var l = document.createElement("link");
              l.rel = "preload"; l.as = "image"; l.href = h.src; l.setAttribute("fetchpriority", "high");
              if (h.set) { l.setAttribute("imagesrcset", h.set); l.setAttribute("imagesizes", h.sizes || "100vw"); }
              document.head.appendChild(l);
            }
          }
          if (sp.boot) document.documentElement.className += " ttc-boot";
        } catch (e) {}
      })();
    </script>

      #ttc-boot i { display: block; width: 140px; height: 4px; border-radius: 4px; background: #EADFD3; overflow: hidden; }
      #ttc-boot i::after { content: ""; display: block; width: 40%; height: 100%; background: #6B1E2A; animation: ttcboot 1s ease-in-out infinite; }
      @keyframes ttcboot { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
